<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écoute sonore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ====== BARRE HAUT DE PAGE ====== -->
    <div class="top-bar">
        
        <!-- Ligne gauche -->
        <div class="line"></div>

        <!-- Texte central cliquable -->
        <!-- target="_blank" ouvre dans un nouvel onglet -->
        <!-- rel="noopener noreferrer" est recommandé pour la sécurité -->
        <a href="https://google.fr" 
           target="_blank" 
           rel="noopener noreferrer"
           class="top-link">
           Esprit Créatif
        </a>

        <!-- Ligne droite -->
        <div class="line"></div>

    </div>
	
  <!-- PAGE ACCUEIL -->
<section id="home" class="active">
 <div class="container">

		<h1>Choisissez un son</h1>

<div class="home-scroll">
  <div class="grid">
  
    <!-- Vignettes -->
    <div class="card"
         data-sound="sounds/ruisseau.mp3"
         data-name="Ruisseau"
         data-image="images/ruisseau.jpg">
      <img src="images/ruisseau.jpg" alt="Ruisseau">
      <span>Ruisseau</span>
    </div>
	
	<div class="card"
         data-sound="sounds/vagues.mp3"
         data-name="Vagues"
         data-image="images/vagues.jpg">
      <img src="images/vagues.jpg" alt="Vagues">
      <span>Vagues</span>
    </div>
	
	<div class="card"
         data-sound="sounds/pluie.mp3"
         data-name="Pluie"
         data-image="images/pluie.jpg">
      <img src="images/pluie.jpg" alt="Pluie">
      <span>Pluie</span>
    </div>
	
	<div class="card"
         data-sound="sounds/orage.mp3"
         data-name="Orage"
         data-image="images/orage.jpg">
      <img src="images/orage.jpg" alt="Orage">
      <span>Orage</span>
    </div>
	
	<div class="card"
         data-sound="sounds/vent.mp3"
         data-name="Vent"
         data-image="images/vent.jpg">
      <img src="images/vent.jpg" alt="Vent">
      <span>Vent</span>
    </div>
		
	<div class="card"
         data-sound="sounds/feu.mp3"
         data-name="Feu"
         data-image="images/feu.jpg">
      <img src="images/feu.jpg" alt="Feu">
      <span>Feu</span>
    </div>
	
	<div class="card"
         data-sound="sounds/guitare.mp3"
         data-name="Guitare"
         data-image="images/guitare.jpg">
      <img src="images/guitare.jpg" alt="Guitare">
      <span>Guitare</span>
    </div>

	<div class="card"
         data-sound="sounds/violoncelle.mp3"
         data-name="Violoncelle"
         data-image="images/violoncelle.jpg">
      <img src="images/violoncelle.jpg" alt="Violoncelle">
      <span>Violoncelle</span>
    </div>

<div class="card"
         data-sound="sounds/piano.mp3"
         data-name="Piano"
         data-image="images/piano.jpg">
      <img src="images/piano.jpg" alt="Piano">
      <span>Piano</span>
    </div>

	<div class="card"
         data-sound="sounds/oiseaux.mp3"
         data-name="Oiseaux"
         data-image="images/oiseaux.jpg">
      <img src="images/oiseaux.jpg" alt="Oiseaux">
      <span>Printemps</span>
    </div>

<div class="card"
         data-sound="sounds/feuilles.mp3"
         data-name="Feuilles"
         data-image="images/feuilles.jpg">
      <img src="images/feuilles.jpg" alt="Feuilles">
      <span>Automne</span>
    </div>

  	<div class="card"
         data-name="Surprise"
         data-image="images/surprise.jpg">
      <img src="images/surprise.jpg" alt="Surprise">
      <span>Surprise</span>
    </div>
  
  </div>

  <!-- Slider durée -->
  <div class="duration-container">
    <input
      type="range"
      id="duration"
      min="1"
      max="30"
      step="1"
      value="10"
    >

    <div class="duration-box">
      <span id="durationValue">10</span>
      <small>Min.</small>
    </div>
  </div>

  <!-- Bouton play -->
  <button id="startBtn" class="play-btn play"></button>
  
 </div>
 </div>
</section>


  <!-- PAGE LECTURE -->
<section id="player">
 <div class="container">
 
  <img id="playerImage" alt="">

  <h2 id="playerTitle"></h2>

  <div class="progress">
    <span id="currentTime">0:00</span>

    <input
      type="range"
      id="progressBar"
      min="0"
      value="0"
      step="1"
    >

    <span id="remainingTime">-0:00</span>
</div>

<button id="togglePlay" class="play-btn pause"></button>

<div class="stop-slot">
  <button id="stopBtn" class="stop-btn">
    Terminer
  </button>
</div>

</div>

</section>

  <audio id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
